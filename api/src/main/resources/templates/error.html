<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Não foi possível concluir')}"></head>
<body class="d-flex align-items-center min-vh-100">
<!-- Página genérica para os demais códigos de erro (403, 400, 413...) -->
<main class="container" style="max-width: 520px">
    <h1 class="h3 mb-1 text-success">Recicla<strong>THE</strong></h1>
    <div class="card card-body shadow-sm mt-3">
        <p class="display-6 mb-1 text-warning" th:text="${status} ?: 'Erro'">Erro</p>
        <h2 class="h5">Não foi possível concluir</h2>
        <p class="text-muted mb-3" th:text="${status == 403} ? 'Você não tem permissão para acessar esta página.' : (${status == 413} ? 'O arquivo enviado é grande demais.' : 'A requisição não pôde ser atendida.')">A requisição não pôde ser atendida.</p>
        <div class="d-flex gap-2">
            <a class="btn btn-success" th:href="@{/admin}">Voltar ao painel</a>
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Página anterior</a>
        </div>
    </div>
</main>
</body>
</html>
