<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Página não encontrada')}"></head>
<body class="d-flex align-items-center min-vh-100">
<!-- Usada pelo PainelExceptionHandler e pelo tratamento de erro padrão do Spring Boot -->
<main class="container" style="max-width: 520px">
    <h1 class="h3 mb-1 text-success">Recicla<strong>THE</strong></h1>
    <div class="card card-body shadow-sm mt-3">
        <p class="display-6 mb-1 text-muted">404</p>
        <h2 class="h5">Página não encontrada</h2>
        <p class="text-muted mb-3" th:text="${detalhe} ?: 'O endereço não existe ou o registro foi excluído.'">O endereço não existe ou o registro foi excluído.</p>
        <div class="d-flex gap-2">
            <a class="btn btn-success" th:href="@{/admin}">Voltar ao painel</a>
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Página anterior</a>
        </div>
    </div>
</main>
</body>
</html>
