<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · ReciclaTHE'">ReciclaTHE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/painel.css}">
</head>
<body>
<nav th:fragment="menu(ativo)" class="navbar navbar-expand-md navbar-dark bg-success mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin}">Recicla<strong>THE</strong> · Painel</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'painel'} ? active" th:href="@{/admin}">Painel</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'pontos'} ? active" th:href="@{/admin/pontos}">Pontos de coleta</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'materiais'} ? active" th:href="@{/admin/materiais}">Orientações</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'zonas'} ? active" th:href="@{/admin/zonas}">Zonas</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'erros'} ? active" th:href="@{/admin/erros-modelo}">Feedback do modelo</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'usuarios'} ? active" th:href="@{/admin/usuarios}">Usuários</a></li>
            </ul>
            <a class="btn btn-link btn-sm text-light" th:classappend="${ativo == 'conta'} ? fw-semibold" th:href="@{/admin/conta}">Minha senha</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
</div>

<!-- Paginação: "url" é a rota da lista já com os filtros (ex.: /admin/pontos?status=PENDENTE) -->
<nav th:fragment="paginacao(pagina, url)" th:if="${pagina.totalPages > 1}"
     class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
    <span class="small text-muted"
          th:text="|Página ${pagina.number + 1} de ${pagina.totalPages} · ${pagina.totalElements} itens|"></span>
    <ul class="pagination pagination-sm mb-0">
        <li class="page-item" th:classappend="${pagina.first} ? disabled">
            <a class="page-link" th:href="@{${url}(pagina=${pagina.number - 1})}">Anterior</a></li>
        <li class="page-item" th:classappend="${pagina.last} ? disabled">
            <a class="page-link" th:href="@{${url}(pagina=${pagina.number + 1})}">Próxima</a></li>
    </ul>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
