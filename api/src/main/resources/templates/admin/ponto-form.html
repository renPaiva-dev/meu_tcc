<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Ponto de coleta')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu('pontos')}"></nav>
<main class="container pb-5" style="max-width: 900px">
    <h1 class="h3 mb-3" th:text="${ponto == null} ? 'Novo ponto de coleta' : 'Editar ponto'"></h1>
    <div th:if="${erros}" class="alert alert-danger">
        <ul class="mb-0"><li th:each="e : ${erros}" th:text="${e}"></li></ul>
    </div>

    <form th:action="${ponto == null} ? @{/admin/pontos} : @{/admin/pontos/{id}(id=${ponto.id})}" method="post"
          class="card card-body">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label" for="nome">Nome</label>
                <input class="form-control" id="nome" name="nome" th:value="${dados.nome()}" required maxlength="160">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="tipo">Tipo</label>
                <select class="form-select" id="tipo" name="tipo">
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.descricao}" th:selected="${t == dados.tipo()}"></option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label" for="endereco">Endereço</label>
                <input class="form-control" id="endereco" name="endereco" th:value="${dados.endereco()}" required maxlength="255">
            </div>
            <div class="col-12">
                <label class="form-label">Localização <span class="text-muted small">(clique no mapa para marcar)</span></label>
                <div id="mapa"></div>
            </div>
            <div class="col-6">
                <label class="form-label" for="latitude">Latitude</label>
                <input class="form-control" id="latitude" name="latitude" th:value="${dados.latitude()}" required>
            </div>
            <div class="col-6">
                <label class="form-label" for="longitude">Longitude</label>
                <input class="form-control" id="longitude" name="longitude" th:value="${dados.longitude()}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="horario">Horário de funcionamento</label>
                <input class="form-control" id="horario" name="horario" th:value="${dados.horario()}" maxlength="255">
            </div>
            <div class="col-md-6">
                <label class="form-label" for="telefone">Telefone</label>
                <input class="form-control" id="telefone" name="telefone" th:value="${dados.telefone()}" maxlength="30">
            </div>
            <div class="col-12">
                <label class="form-label">Materiais aceitos</label>
                <div>
                    <div class="form-check form-check-inline" th:each="m : ${todosMateriais}">
                        <input class="form-check-input" type="checkbox" name="materiais" th:id="'mat-' + ${m.codigo}"
                               th:value="${m.codigo}" th:checked="${dados.materiais() != null and dados.materiais().contains(m.codigo)}">
                        <label class="form-check-label" th:for="'mat-' + ${m.codigo}">
                            <span class="cor-material" th:style="'background:' + ${m.corHex}"></span><span th:text="${m.nome}"></span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label" for="fonte">Fonte da informação</label>
                <input class="form-control" id="fonte" name="fonte" th:value="${dados.fonte()}" maxlength="500"
                       placeholder="Ex.: link da notícia ou da página da prefeitura">
            </div>
        </div>
        <div class="d-flex justify-content-between mt-4">
            <a class="btn btn-outline-secondary" th:href="@{/admin/pontos}">Voltar</a>
            <button class="btn btn-success" type="submit">Salvar</button>
        </div>
    </form>

    <div class="card card-body mt-3" th:if="${ponto != null}">
        <img th:if="${ponto.fotoArquivo}" class="img-fluid rounded mb-3" style="max-height: 320px; object-fit: contain"
             th:src="@{/admin/pontos/{id}/foto(id=${ponto.id})}" alt="Foto enviada pelo usuário">
        <form th:action="@{/admin/pontos/{id}/excluir(id=${ponto.id})}" method="post"
              onsubmit="return confirm('Excluir este ponto definitivamente?')">
            <button class="btn btn-outline-danger btn-sm">Excluir ponto</button>
        </form>
    </div>
</main>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const lat = document.getElementById('latitude');
    const lon = document.getElementById('longitude');
    const temPonto = lat.value && lon.value;
    const centro = temPonto ? [parseFloat(lat.value), parseFloat(lon.value)] : [-5.0892, -42.8016];
    const mapa = L.map('mapa').setView(centro, temPonto ? 16 : 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; colaboradores do OpenStreetMap'
    }).addTo(mapa);
    let marcador = temPonto ? L.marker(centro).addTo(mapa) : null;
    mapa.on('click', e => {
        lat.value = e.latlng.lat.toFixed(6);
        lon.value = e.latlng.lng.toFixed(6);
        if (marcador) marcador.setLatLng(e.latlng); else marcador = L.marker(e.latlng).addTo(mapa);
    });
</script>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
