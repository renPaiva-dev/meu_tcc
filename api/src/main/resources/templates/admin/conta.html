<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Minha senha')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu('conta')}"></nav>
<main class="container pb-5" style="max-width: 480px">
    <h1 class="h3 mb-3">Trocar minha senha</h1>
    <div th:replace="~{fragmentos :: alertas}"></div>
    <form th:action="@{/admin/conta/senha}" method="post" class="card card-body">
        <label class="form-label" for="senhaAtual">Senha atual</label>
        <input class="form-control mb-3" type="password" id="senhaAtual" name="senhaAtual" required autocomplete="current-password">
        <label class="form-label" for="novaSenha">Nova senha</label>
        <input class="form-control mb-1" type="password" id="novaSenha" name="novaSenha" required minlength="8" maxlength="72"
               autocomplete="new-password">
        <div class="form-text mb-3">Mínimo de 8 caracteres.</div>
        <label class="form-label" for="confirmacao">Confirme a nova senha</label>
        <input class="form-control mb-4" type="password" id="confirmacao" name="confirmacao" required autocomplete="new-password">
        <button class="btn btn-success" type="submit">Salvar nova senha</button>
    </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
