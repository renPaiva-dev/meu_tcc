spring:
  application:
    name: reciclathe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reciclathe}
    username: ${DB_USUARIO:reciclathe}
    password: ${DB_SENHA:reciclathe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # Cabe a importação de bairros (GeoJSON); o limite das fotos é aplicado em ArmazenamentoFotos
      max-file-size: 20MB
      max-request-size: 21MB

server:
  # Atrás de um proxy HTTPS (nginx, Traefik...), usa X-Forwarded-* para IP, esquema e host
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Ligue (COOKIE_SEGURO=true) quando o painel for servido por HTTPS
        secure: ${COOKIE_SEGURO:false}
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  # Documenta só a API do app; o painel não entra
  paths-to-match: /api/**
  api-docs:
    enabled: ${DOCS_API:true}
  swagger-ui:
    enabled: ${DOCS_API:true}

reciclathe:
  fuso-horario: America/Fortaleza
  jwt:
    # Obrigatório em produção: ao menos 32 caracteres aleatórios
    segredo: ${JWT_SEGREDO:}
    validade: 30d
  fotos:
    diretorio: ${FOTOS_DIR:./dados/fotos}
    tamanho-maximo: 5MB
  admin:
    nome: Administrador
    email: ${ADMIN_EMAIL:admin@reciclathe.local}
    senha: ${ADMIN_SENHA:}
  limites:
    # Check-ins pontuados por usuário por dia (além do limite de 1 por ponto por dia)
    checkins-por-dia: 5
    # Sugestões PENDENTES simultâneas por usuário
    sugestoes-pendentes: 10
    # Tentativas de login/cadastro por IP por minuto (API e painel)
    tentativas-por-minuto: ${LIMITE_TENTATIVAS:10}
  osm:
    overpass-urls:
      - https://overpass-api.de/api/interpreter
      - https://maps.mail.ru/osm/tools/overpass/api/interpreter
      - https://overpass.kumi.systems/api/interpreter
      - https://overpass.private.coffee/api/interpreter
    municipio: Teresina
    timeout: 90s
